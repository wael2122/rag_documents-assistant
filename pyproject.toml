[project]
name = "doc-assistant"
version = "0.0.1"
description = "Assistant documentaire multimodal sur des rapports annuels, 100 % local"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
# Ajoutées au fil des phases pour garder la CI légère.
# torch et torchvision sont listés explicitement pour que uv prenne la version CUDA sous Windows.
ingest = ["docling>=2.0", "torch>=2.7", "torchvision>=0.22"]
retrieval = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
doc-assistant = "doc_assistant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Typographie française voulue (« », –, ’, espaces insécables) : pas des caractères ambigus.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pgvector.*", "docling.*", "docling_core.*"]
ignore_missing_imports = true
# Docling n'est installé qu'avec l'extra « ingest » : même typage avec ou sans lui.
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Copie au lieu de liens physiques : évite les erreurs avec OneDrive sous Windows.
link-mode = "copy"

# PyTorch avec CUDA 12.8 sous Windows (GPU NVIDIA) ; la version standard ailleurs.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]
