name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Installer Python et les dépendances
        run: uv sync --extra dev --python 3.11
      - name: Créer le schéma de la base
        run: PGPASSWORD=rag psql -h localhost -U rag -d rag -v ON_ERROR_STOP=1 -f sql/001_init.sql
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typage
        run: uv run mypy src
      - name: Tests
        run: uv run pytest --cov=doc_assistant
      - name: Jeu de test valide
        run: uv run doc-assistant check-golden-set
